apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f compose.test.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: bookingservicegrpc-db
  name: bookingservicegrpc-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bookingservicegrpc-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f compose.test.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: bookingservicegrpc-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: db
            - name: POSTGRES_PASSWORD
              value: hotelio
            - name: POSTGRES_USER
              value: hotelio
          image: postgres:17
          livenessProbe:
            exec:
              command:
                - pg_isready -U hotelio -P hotelio -d db
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: booking-service-db-test
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: bookingservicegrpc-db-data-test
      restartPolicy: Always
      volumes:
        - name: bookingservicegrpc-db-data-test
          persistentVolumeClaim:
            claimName: bookingservicegrpc-db-data-test
