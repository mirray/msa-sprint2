apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f compose.test.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: booking-service
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: booking-service
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f compose.test.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: booking-service
    spec:
      containers:
        - env:
            - name: DATABASE_HOST
              value: bookingservicegrpc-db
            - name: DATABASE_NAME
              value: db
            - name: DATABASE_PASSWORD
              value: hotelio
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: hotelio
            - name: HOTEL_HOST
              value: http://host.docker.internal:8084/api/hotels/
            - name: KAFKA_HOST
              value: PLAINTEXT://host.docker.internal:9092
            - name: PROMO_CODE_HOST
              value: http://host.docker.internal:8084/api/promos/
            - name: REVIEW_HOST
              value: http://host.docker.internal:8084/api/reviews/
            - name: USER_API_HOST
              value: http://host.docker.internal:8084/api/users/
          image: booking-service-grpc:1.0.0
          name: booking-service-test
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
