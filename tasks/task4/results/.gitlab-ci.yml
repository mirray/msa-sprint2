variables:
  DOCKER_HOST: unix:///var/run/docker.sock # use local docker installation

stages:
  - build
  - test
  - test-feature
  - deploy
  - checkDNS

build:
  stage: build
  script:
    - echo "Run build"
    - docker build -f ./docker/booking-service-grpc/Dockerfile -t booking-service-grpc:1.0.0 .

deploy:
  stage: deploy
  script:
    #- minikube image load booking-service-grpc:1.0.0
    - helm install booking-service-grpc booking-service-grpc

test:
  stage: test
  variables:
    POSTGRES_USER: hotelio
    POSTGRES_PASSWORD: hotelio
    POSTGRES_DB: db
  script:
    - echo "Start test"
    - docker compose -f ./docker/compose.test.yml up -d
    - curl "http://localhost/ping"
    - docker stop booking-service-test
    - docker stop booking-service-db-test
    - docker rm booking-service-test
    - docker rm booking-service-db-test
 
test-feature:
  stage: test-feature
  variables:
    POSTGRES_USER: hotelio
    POSTGRES_PASSWORD: hotelio
    POSTGRES_DB: db
  script:
    - echo "Start test"
    - docker compose -f ./docker/compose.test.yml -f ./docker/compose.test-feature.yml up -d
    - curl "http://localhost/ping"
    - curl "http://localhost/feature"
    - docker stop booking-service-test
    - docker stop booking-service-db-test
    - docker rm booking-service-test
    - docker rm booking-service-db-test

checkDNS:
  stage: checkDNS
  script:
    - echo "Check DNS"
    - docker compose -f ./docker/test/CheckDNS/compose.yml up -d --build