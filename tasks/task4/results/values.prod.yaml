#booking-service-grpc
b:
  #booking-service-grpc
  s:
    name: booking-service
    replicas: 1
    image: 
      name: booking-service-grpc
      tag: 1.0.0
    container:
      name: booking-service
      ports:
        grpc:
          name: "'9090'" 
          internal: 9090
          external: 8081
        http: 
          name: "'80'"
          internal: 80
          external: 8080
      env:
        DATABASE_HOST: bookingservicegrpc-db
        DATABASE_NAME: db
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        DATABASE_PORT: "'5432'"
        DATABASE_USERNAME: ${DATABASE_USERNAME}
        HOTEL_HOST: https://${API_HOST}/api/hotels/
        KAFKA_HOST: HTTPS://${KAFKA_HOST}:9092
        PROMO_CODE_HOST: https://${API_HOST}/api/promos/
        REVIEW_HOST: https://${API_HOST}/api/reviews/
        USER_API_HOST: https://${API_HOST}/api/users/
      readinessProbe:
        enabled: true
        httpGet:
          path: /ping
          port: 8080
        failureThreshold: 15
        periodSeconds: 10
      livenessProbe:
        enabled: true
        httpGet:
          path: /ping
          port: 8080
        failureThreshold: 1
        periodSeconds: 10
  volume:
    name: bookingservicegrpc-db-data
    path: /var/lib/postgresql/data
    resources:
      requests:
        storage: 100Mi
  db:
    name: bookingservicegrpc-db
    replicas: 1
    container:
      name: bookingservicegrpc-db
      env:
        POSTGRES_DB: db
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_USER: ${DATABASE_USERNAME}
      image: postgres:17
      ports:
        psql:
          name: "'5432'"
          internal: 5432
          external: 5432
  