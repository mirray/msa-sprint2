version: '3.8'

services:
  apollo-gateway:
    build: ./gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    depends_on:
      - booking-subgraph
      - hotel-subgraph
      - promocode-subgraph
    networks:
      - hotelio-net

  booking-subgraph:
    build: ./booking-subgraph
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:4001"
    networks:
      - hotelio-net

  hotel-subgraph:
    build: ./hotel-subgraph
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4002:4002"
    networks:
      - hotelio-net
  
  promocode-subgraph:
    build: ./promocode-subgraph
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4003:4003"
    networks:
      - hotelio-net

networks:
  hotelio-net:
    external: true
