apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-service
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - booking-gateway
  http:
  - match:
    - headers:
        x-version:
          exact: "v2"
    route:
      - destination:
          host: booking-service-grpc-v2
        weight: 100
  - route:
    - destination:
        host: booking-service-grpc-v1
      weight: 90
    - destination:
        host: booking-service-grpc-v2
      weight: 10
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 10s