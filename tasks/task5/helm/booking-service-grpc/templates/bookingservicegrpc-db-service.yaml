apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.b.db.name }}
  name: {{ .Values.b.db.name }}
spec:
  ports:
    - name: {{ .Values.b.db.container.ports.psql.name }}
      port: {{ .Values.b.db.container.ports.psql.internal }}
      targetPort: {{ .Values.b.db.container.ports.psql.external }}
  selector:
    app: {{ .Values.b.db.name }}
